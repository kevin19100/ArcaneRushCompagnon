name: Build Arcane Rush Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'sync-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/sync-v*") {
            $version = "${{ github.ref_name }}" -replace '^sync-v', ''
          } else {
            [xml]$project = Get-Content .\src\ArcaneRushSync\ArcaneRushSync.csproj
            $node = Select-Xml -Xml $project -XPath "/Project/PropertyGroup/Version" | Select-Object -First 1
            $version = if ($node) { [string]$node.Node.InnerText } else { "1.1.0" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish Windows x64
        shell: pwsh
        run: .\tools\build-test-windows.ps1 -Version "${{ steps.meta.outputs.version }}" -GitHubRepository "${{ github.repository }}"

      - name: Create update ZIP
        shell: pwsh
        run: |
          $zip = ".\artifacts\ArcaneRushSync-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path .\artifacts\win-x64\* -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneRushSync-win-x64
          path: artifacts/ArcaneRushSync-win-x64.zip

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/sync-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = ".\artifacts\ArcaneRushSync-win-x64.zip"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "Arcane Rush Sync ${{ steps.meta.outputs.version }}" --generate-notes
          }
