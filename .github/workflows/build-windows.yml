name: Build Arcane Rush Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'sync-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional code signing (Azure Artifact Signing). Leave the repository variable
      # SIGNING_ENABLED unset and every signing step is skipped: the build still works.
      SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/sync-v*") {
            $version = "${{ github.ref_name }}" -replace '^sync-v', ''
          } else {
            [xml]$project = Get-Content .\src\ArcaneRushSync\ArcaneRushSync.csproj
            $node = Select-Xml -Xml $project -XPath "/Project/PropertyGroup/Version" | Select-Object -First 1
            $version = if ($node) { [string]$node.Node.InnerText } else { "1.2.0" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish Windows x64
        shell: pwsh
        run: .\tools\build-test-windows.ps1 -Version "${{ steps.meta.outputs.version }}" -GitHubRepository "${{ github.repository }}"

      # --- Optional: sign our own executables before packaging -------------------------
      - name: Sign application (Azure Artifact Signing)
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v1.2.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\win-x64\ArcaneRushSync.exe,${{ github.workspace }}\artifacts\win-x64\ArcaneRushSync.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Create update ZIP
        shell: pwsh
        run: |
          $zip = ".\artifacts\ArcaneRushSync-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path .\artifacts\win-x64\* -DestinationPath $zip -CompressionLevel Optimal

      - name: Build per-user installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Host
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup introuvable." }
          & $iscc "/DAppVersion=${{ steps.meta.outputs.version }}" "/DSourceDir=$PWD\artifacts\win-x64" "/DOutputDir=$PWD\artifacts" ".\installer\ArcaneRushSync.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC a echoue." }

      - name: Sign installer (Azure Artifact Signing)
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v1.2.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\ArcaneRushSync-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $lines = foreach ($f in @("ArcaneRushSync-Setup.exe", "ArcaneRushSync-win-x64.zip")) {
            $h = (Get-FileHash ".\artifacts\$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $f"
          }
          $lines | Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii
          Get-Content .\artifacts\SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneRushSync-${{ steps.meta.outputs.version }}
          path: |
            artifacts/ArcaneRushSync-Setup.exe
            artifacts/ArcaneRushSync-win-x64.zip
            artifacts/SHA256SUMS.txt

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/sync-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(".\artifacts\ArcaneRushSync-Setup.exe", ".\artifacts\ArcaneRushSync-win-x64.zip", ".\artifacts\SHA256SUMS.txt")
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Arcane Rush Sync ${{ steps.meta.outputs.version }}" --generate-notes
          }
